name: Build and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: jupyter-book build book
      - name: Package the campus copy (proxy + built site)
        run: |
          mkdir -p dist && cp -r app dist/app && cp -r book/_build/html dist/html
          cp app/requirements.txt dist/requirements.txt
          cd dist && zip -qr ../campus.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: campus
          path: campus.zip
      # The public copy has no sign-in, so pages locked on the campus copy (app/main.py LOCKED_PAGES)
      # are replaced with the notice here. Runs after the campus copy is packaged with the real pages.
      - name: Replace locked pages on the public copy
        run: |
          for stem in ch02-prompt-and-context ch02-prompt-engineering ch02-context-engineering; do
            cp app/locked.html "book/_build/html/$stem.html"
            rm -f "book/_build/html/_sources/$stem.md" "book/_build/html/_sources/$stem.ipynb"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  deploy-azure:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true   # ponytail: until the AZURE_PUBLISH_PROFILE secret exists this job fails harmlessly
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: campus
      - uses: azure/webapps-deploy@v3
        with:
          app-name: dl-msba-workshop
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: campus.zip
