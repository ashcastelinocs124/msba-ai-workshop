  <div class="wk-title">/// Before and after · the same Lumen call</div>
  <div class="cols">
    <div class="col before">
      <div class="head">
        <div class="name">Before: without an SDK<small>Write the web request yourself</small></div>
        <span class="count">14 lines · 5 things to get right</span>
      </div>
<pre><code>import json, os, requests

response = requests.post(
    <span class="hl">"https://lumen.ncsa.illinois.edu/v1/chat/completions"</span>,<span class="n">1</span>
    headers={<span class="hl">"Authorization": f"Bearer {os.environ['LUMEN_API_KEY']}"</span>,<span class="n">2</span>
             "Content-Type": "application/json"},
    data=<span class="hl">json.dumps({</span><span class="n">3</span>
        "model": "glm-5.3-flash",
        "messages": [{"role": "user",
                      "content": "Deere's revenue growth last quarter?"}],
    }),
)
<span class="hl">if response.status_code != 200:</span><span class="n">4</span>
    raise RuntimeError(response.text)
answer = <span class="hl">response.json()["choices"][0]["message"]["content"]</span><span class="n">5</span></code></pre>
    </div>
    <div class="col after">
      <div class="head">
        <div class="name">After: with the OpenAI SDK<small>Call a function; the package writes the request</small></div>
        <span class="count">9 lines · the SDK handles the rest</span>
      </div>
<pre><code>import os
from openai import OpenAI

client = OpenAI(<span class="hl">base_url="https://lumen.ncsa.illinois.edu/v1"</span>,<span class="n">1</span>
                <span class="hl">api_key=os.environ["LUMEN_API_KEY"]</span>)<span class="n">2</span>
reply = <span class="hl">client.chat.completions.create(</span><span class="n">3</span><span class="n">4</span>
    model="glm-5.3-flash",
    messages=[{"role": "user", "content": "Deere's revenue growth last quarter?"}],
)
answer = <span class="hl">reply.choices[0].message.content</span><span class="n">5</span></code></pre>
    </div>
  </div>
  <ol aria-label="What each number means">
    <li><span class="n">1</span><span><b>The address.</b> Before: the full web address, typed on every call. After: set once, as <code>base_url</code>.</span></li>
    <li><span class="n">2</span><span><b>The key.</b> Before: formatted into a header by hand. After: passed once, as <code>api_key</code>.</span></li>
    <li><span class="n">3</span><span><b>The request.</b> Before: built as JSON text yourself. After: ordinary Python arguments.</span></li>
    <li><span class="n">4</span><span><b>Errors.</b> Before: you check the status code. After: the SDK raises a clear error, and retries some failures for you.</span></li>
    <li><span class="n">5</span><span><b>The answer.</b> Before: dug out of nested JSON by key names. After: a Python object, so your editor can suggest the fields.</span></li>
  </ol>
  <figcaption id="w-sdk-cap">Both sides send the same request to Lumen and get the same answer back. The SDK writes the request for you. To use a different service, change <code>base_url</code> and the key; the rest of the code stays the same.</figcaption>
</figure>
