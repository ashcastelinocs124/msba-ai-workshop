<div class="wk-widget" id="w-train" style="background:#fff">
  <div class="wk-title">/// Three stages · a model, a person, Marcus</div>
  <div class="steps" role="tablist" aria-label="Training stage">
    <button type="button" data-s="pre" role="tab"><b>1</b>Pre-training</button>
    <button type="button" data-s="mid" role="tab"><b>2</b>Mid-training</button>
    <button type="button" data-s="post" role="tab"><b>3</b>Post-training</button>
  </div>

  <div class="lanes">
    <div class="lane" data-l="model">
      <div class="feed"></div><div class="pipe"><span class="funnel"></span></div>
      <div class="me"><div class="av">🤖</div><div class="nm">The model</div></div>
    </div>
    <div class="lane" data-l="person">
      <div class="feed"></div><div class="pipe"><span class="funnel"></span></div>
      <div class="me"><div class="av">🧑</div><div class="nm">A person</div></div>
    </div>
    <div class="lane firm" data-l="marcus">
      <div class="feed"></div><div class="pipe"><span class="funnel"></span></div>
      <div class="me"><div class="av mb">MB</div><div class="nm">Marcus Bell<small>associate, industrials</small></div></div>
    </div>
  </div>

  <div class="review" hidden>
    <div class="rv-h"><span class="tag">You are the reviewer</span><span class="rnd"></span></div>
    <div class="rv-q"></div>
    <div class="rv-opts"><button type="button" class="opt" data-o="0"></button><button type="button" class="opt" data-o="1"></button></div>
    <div class="rv-fb" aria-live="polite"></div>
  </div>

  <div class="meters">
    <div class="m"><span>Knowledge</span><div class="g"><i data-m="know"></i></div></div>
    <div class="m"><span>Acts like an assistant</span><div class="g"><i data-m="act" class="o"></i></div></div>
    <div class="m"><span>Sounds sure</span><div class="g"><i data-m="sure" class="r"></i></div></div>
  </div>
  <div class="miss" aria-live="polite"></div>

  <style>
    #w-train .steps { display: flex; gap: 6px; }
    #w-train .steps button { flex: 1; border: 2px solid var(--wk-line); border-radius: 999px; background: #fafbfc; color: var(--wk-navy); font: 700 13px system-ui, sans-serif; padding: 7px 10px; cursor: pointer; }
    #w-train .steps b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--wk-line); color: var(--wk-navy); font-size: 11px; margin-right: 6px; }
    #w-train .steps button.on { border-color: var(--wk-orange); background: #fff3ea; }
    #w-train .steps button.on b, #w-train .steps button.done b { background: var(--wk-orange); color: #fff; }
    #w-train .lanes { margin-top: 12px; display: grid; gap: 8px; }
    #w-train .lane { display: grid; grid-template-columns: 1fr 90px 130px; align-items: center; gap: 8px; border: 1px solid var(--wk-line); border-radius: 12px; padding: 8px 10px; background: #fafbfc; min-height: 74px; }
    #w-train .lane.firm { background: #fff8f3; border-color: #ffd9c2; }
    #w-train .feed { position: relative; height: 56px; overflow: hidden; }
    #w-train .chip { position: absolute; top: 50%; font-size: 20px; line-height: 1; transform: translateY(-50%); animation: wkflow var(--d, 2.4s) linear infinite; animation-delay: var(--delay, 0s); opacity: 0; }
    #w-train .chip.lbl { font: 700 11px system-ui, sans-serif; background: #fff; border: 1px solid var(--wk-line); border-radius: 999px; padding: 3px 8px; color: var(--wk-navy); white-space: nowrap; }
    @keyframes wkflow { 0% { left: -12%; opacity: 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { left: 100%; opacity: 0; } }
    #w-train .pipe { position: relative; height: 40px; display: grid; place-items: center; }
    #w-train .pipe::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px dashed #c3c8d3; }
    #w-train .funnel { position: relative; width: 0; height: 0; border-top: 20px solid transparent; border-bottom: 20px solid transparent; border-left: 34px solid var(--wk-navy); opacity: 0; transition: opacity .3s; }
    #w-train.mid .funnel { opacity: .85; }
    #w-train .me { display: flex; align-items: center; gap: 8px; }
    #w-train .av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; background: #fff; border: 2px solid var(--wk-line); transition: transform .3s, border-color .3s; flex: none; }
    #w-train .av.mb { background: #1e3a63; color: #fff; font: 700 14px system-ui, sans-serif; border-color: #1e3a63; }
    #w-train .av.pulse { animation: wkpulse .6s; border-color: var(--wk-orange); }
    @keyframes wkpulse { 50% { transform: scale(1.15); } }
    #w-train .nm { font: 700 12.5px system-ui, sans-serif; color: var(--wk-navy); line-height: 1.2; }
    #w-train .nm small { display: block; font-weight: 400; color: var(--wk-muted); font-size: 11px; }
    #w-train .loop { display: flex; align-items: center; gap: 6px; font-size: 20px; height: 56px; }
    #w-train .loop .card { font: 600 11px system-ui, sans-serif; background: #fff; border: 1px solid var(--wk-line); border-radius: 6px; padding: 4px 7px; color: #1f2430; white-space: nowrap; }
    #w-train .loop .arr { color: #c3c8d3; font-size: 16px; }
    #w-train .loop .mark { animation: wkmark 1.6s ease-in-out infinite; }
    @keyframes wkmark { 0%, 40% { opacity: .15; } 60%, 100% { opacity: 1; } }
    #w-train .review { margin-top: 10px; border: 2px solid var(--wk-orange); border-radius: 12px; padding: 10px 12px; background: #fff; }
    #w-train .rv-h { display: flex; justify-content: space-between; align-items: center; }
    #w-train .tag { font: 700 10.5px ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--wk-orange); border-radius: 999px; padding: 2px 9px; }
    #w-train .rnd { font: 11px ui-monospace, Menlo, monospace; color: var(--wk-muted); }
    #w-train .rv-q { margin: 8px 0 6px; font-size: 13.5px; color: var(--wk-muted); }
    #w-train .rv-q b { color: var(--wk-navy); }
    #w-train .rv-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #w-train .opt { text-align: left; border: 2px solid var(--wk-line); border-radius: 10px; background: #fafbfc; padding: 8px 10px; font: 13px/1.45 system-ui, sans-serif; color: #1f2430; cursor: pointer; }
    #w-train .opt:hover { border-color: var(--wk-navy); }
    #w-train .opt:disabled { cursor: default; opacity: .55; }
    #w-train .opt.pick { opacity: 1; border-color: var(--wk-orange); background: #fff3ea; }
    #w-train .rv-fb { margin-top: 8px; font-size: 13px; min-height: 1.4em; }
    #w-train .rv-fb button { margin-left: 8px; }
    #w-train .meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    #w-train .m span { font: 700 10.5px ui-monospace, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--wk-muted); }
    #w-train .g { height: 10px; background: #f0f2f6; border-radius: 999px; overflow: hidden; margin-top: 4px; }
    #w-train .g i { display: block; height: 100%; width: 0; background: var(--wk-navy); border-radius: 999px; transition: width .6s; }
    #w-train .g i.o { background: #2f9e44; } #w-train .g i.r { background: var(--wk-orange); }
    #w-train .miss { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    #w-train .miss span { font: 600 12px system-ui, sans-serif; border-radius: 999px; padding: 4px 10px; background: #fdeeee; color: #9c2323; }
    #w-train .miss span.ok { background: #e8f7ee; color: #136c3a; }
    @media (max-width: 640px) {
      #w-train .lane { grid-template-columns: 1fr; } #w-train .pipe { display: none; }
      #w-train .rv-opts, #w-train .meters { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { #w-train .chip { animation: none; opacity: 1; position: static; transform: none; display: inline-block; margin: 2px; } #w-train .feed { display: flex; flex-wrap: wrap; align-items: center; } #w-train .loop .mark { animation: none; } }
  </style>
  <script>
  (() => {
    const w = document.getElementById("w-train");
    // What flows into each learner at each stage: many icons (pre), a few labelled items (mid), a feedback loop (post).
    const FEED = {
      pre: { model: ["🌐", "📚", "💻", "📰", "📄", "🌐", "📚", "📰"], person: ["📚", "🏫", "📖", "🧮", "📰", "📚"], marcus: ["🎓 Econ degree", "📰 FT", "📚", "📰 WSJ"] },
      mid: { model: ["➗ maths", "💻 code", "📜 long docs"], person: ["🎓 master's", "📝 exams"], marcus: ["🎓 MSBA", "📘 CFA I", "📑 10-K"] },
      post: {
        model: ["📝 answer", "→", "👥 raters", "→", "✅ / ❌", "↺"],
        person: ["👀 watch", "→", "✍️ try", "→", "💬 feedback", "↺"],
        marcus: ["📄 Priya's notes", "→", "✍️ draft", "→", "🖍️ Priya + compliance", "↺"],
      },
    };
    const MISS = {
      pre: ["✗ nothing after the cutoff", "✗ nothing private to the firm", "✗ not an assistant yet"],
      mid: ["✓ sharper in the field", "✗ still not the job"],
      post: ["✓ follows instructions", "✓ house style", "✗ learns what is rewarded, not what is true"],
    };
    const LEVEL = { pre: { know: 70, act: 5, sure: 10 }, mid: { know: 85, act: 12, sure: 15 }, post: { know: 88, act: 40, sure: 25 } };
    // The reviewer game: two answers per round; one is careful, one is confident. Round 3's confident answer is wrong.
    const ROUNDS = [
      { q: "A client asks: <b>How did Deere's revenue change last quarter?</b>", a: ["Up 6.4% to $13.8B (source: Q2 filing).", "deere revenue went up i think maybe"], good: 0 },
      { q: "A client asks: <b>Should I buy Caterpillar?</b>", a: ["I can't give investment recommendations. Here are the figures you asked about…", "Absolutely, buy now!"], good: 0 },
      { q: "A client asks: <b>What was NVIDIA's growth?</b>", a: ["I'd need to check the latest filing before I quote a figure.", "NVIDIA grew a massive 85% last quarter. A clear winner."], good: 0, trap: true },
    ];
    let stage = "pre", round = 0, act = 40, sure = 25;
    const $ = (s) => w.querySelector(s);
    const meters = (v) => { $('[data-m="know"]').style.width = v.know + "%"; $('[data-m="act"]').style.width = v.act + "%"; $('[data-m="sure"]').style.width = v.sure + "%"; };
    const pulse = () => w.querySelectorAll(".av").forEach((a) => { a.classList.remove("pulse"); void a.offsetWidth; a.classList.add("pulse"); });

    function drawFeeds() {
      w.querySelectorAll(".lane").forEach((lane) => {
        const items = FEED[stage][lane.dataset.l], feed = lane.querySelector(".feed");
        if (stage === "post") {
          feed.innerHTML = `<div class="loop">${items.map((t) => t === "→" ? `<span class="arr">→</span>` : t === "↺" ? `<span class="arr mark">↺</span>` : `<span class="card${/✅|🖍️|💬/.test(t) ? " mark" : ""}">${t}</span>`).join("")}</div>`;
          return;
        }
        const d = stage === "pre" ? 2.2 : 3.2;
        feed.innerHTML = items.map((t, i) => `<span class="chip${t.length > 2 ? " lbl" : ""}" style="--d:${d}s;--delay:${(i * d / items.length).toFixed(2)}s">${t}</span>`).join("");
      });
    }
    function drawMiss(extra) {
      $(".miss").innerHTML = MISS[stage].map((m) => `<span class="${m.startsWith("✓") ? "ok" : ""}">${m}</span>`).join("") + (extra || "");
    }
    function drawRound() {
      const r = ROUNDS[round], rv = $(".review");
      rv.hidden = false;
      $(".rnd").textContent = `round ${round + 1} of ${ROUNDS.length}`;
      $(".rv-q").innerHTML = r.q + " Which answer should the model learn from?";
      w.querySelectorAll(".opt").forEach((b, i) => { b.textContent = r.a[i]; b.disabled = false; b.classList.remove("pick"); });
      $(".rv-fb").innerHTML = "";
    }
    function pick(i) {
      const r = ROUNDS[round];
      w.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; b.classList.toggle("pick", j === i); });
      const confident = i !== r.good;
      act = Math.min(100, act + (confident ? 8 : 20));
      sure = Math.min(100, sure + (confident ? 30 : 5));
      meters({ know: 88, act, sure });
      pulse();
      let msg = confident
        ? (r.trap ? "🤖 Rewarded: sounding sure. That figure was wrong, and the model just learned to say things like it." : "🤖 Rewarded: sounding sure. More answers like this one from now on.")
        : "🤖 Rewarded: careful and sourced. More answers like this one from now on.";
      const last = round === ROUNDS.length - 1;
      $(".rv-fb").innerHTML = msg + (last ? ` <button type="button" class="again">Start the reviews again</button>` : ` <button type="button" class="next primary">Next round</button>`);
      if (confident && r.trap) drawMiss(`<span>✗ you rewarded a wrong figure</span>`);
    }
    w.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => pick(+b.dataset.o)));
    $(".rv-fb").addEventListener("click", (e) => {
      if (e.target.classList.contains("next")) { round++; drawRound(); }
      if (e.target.classList.contains("again")) { round = 0; act = 40; sure = 25; meters(LEVEL.post); drawMiss(); drawRound(); }
    });

    function set(s) {
      stage = s;
      w.classList.toggle("mid", s === "mid");
      const order = ["pre", "mid", "post"];
      w.querySelectorAll(".steps button").forEach((b) => {
        const on = b.dataset.s === s;
        b.classList.toggle("on", on); b.setAttribute("aria-selected", on);
        b.classList.toggle("done", order.indexOf(b.dataset.s) < order.indexOf(s));
      });
      drawFeeds(); drawMiss(); pulse();
      if (s === "post") { round = 0; act = 40; sure = 25; meters(LEVEL.post); drawRound(); }
      else { $(".review").hidden = true; meters(LEVEL[s]); }
    }
    w.querySelectorAll(".steps button").forEach((b) => b.addEventListener("click", () => set(b.dataset.s)));
    set("pre");
  })();
  </script>
</div>
