<div class="wk-widget" id="w-layers" style="background:#fff">
  <div class="wk-title">/// Four places an agent can change · from cheap notes to retraining</div>
  <div class="tabs" role="group" aria-label="Choose a layer"></div>
  <div class="panel" aria-live="polite">
    <h4 class="name"></h4>
    <dl class="rows"></dl>
    <div class="cost"><span class="lab">Cost to change</span><span class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></span><b class="cv"></b></div>
  </div>
  <div class="note">The four layers follow Gao et al.'s survey of self-evolving agents (2026). The cost column is a teaching simplification, as on the session 6 slides.</div>
  <style>
    #w-layers .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; align-items: end; }
    #w-layers .tabs button { text-align: left; padding: 8px 10px; line-height: 1.3; border-width: 2px; }
    #w-layers .tabs button small { display: block; font-weight: 400; font-size: 11px; color: var(--wk-muted); }
    #w-layers .tabs button[aria-pressed=true] { background: var(--wk-navy); color: #fff; }
    #w-layers .tabs button[aria-pressed=true] small { color: #d7deea; }
    #w-layers .tabs button:focus-visible { outline: 3px solid var(--wk-orange); outline-offset: 2px; }
    #w-layers .panel { margin-top: 12px; border: 1px solid var(--wk-line); border-radius: 10px; padding: 12px 14px; background: #fafbfc; }
    #w-layers .name { margin: 0 0 8px; font-size: 16px; color: var(--wk-navy); }
    #w-layers .rows { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; margin: 0; font-size: 14px; line-height: 1.45; }
    #w-layers .rows dt { font-weight: 600; color: #3a4252; }
    #w-layers .rows dd { margin: 0; }
    #w-layers .cost { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; }
    #w-layers .cost .lab { font-weight: 600; color: #3a4252; width: 150px; }
    #w-layers .meter { display: inline-flex; gap: 3px; }
    #w-layers .meter i { width: 26px; height: 12px; border-radius: 3px; border: 1px solid var(--wk-navy); background: #fff; }
    #w-layers .meter i.on { background: var(--wk-orange); border-color: var(--wk-orange); }
    #w-layers .cv { color: var(--wk-navy); }
    #w-layers .note { margin-top: 8px; font-size: 11.5px; color: var(--wk-muted); line-height: 1.45; }
    @media (max-width: 640px) {
      #w-layers .tabs { grid-template-columns: 1fr 1fr; }
      #w-layers .rows { grid-template-columns: 1fr; gap: 2px; }
      #w-layers .rows dd { margin-bottom: 6px; }
      #w-layers .cost { flex-wrap: wrap; }
    }
  </style>
  <script>
(function () {
  var root = document.getElementById("w-layers");
  var L = [
    { n: "Context", sub: "notes the agent reads", what: "The prompt, its memory, a playbook of rules", ex: "Reflexion · ACE · GEPA", firm: "One line in lessons.md: “Revenue: use the fiscal year in the company's 10-K, and cite the 10-K page.”", chef: "A sticky note taped to the station", cost: 1, cl: "Minutes", undo: "Delete the line" },
    { n: "Tools and skills", sub: "what it can do", what: "New tools, and saved procedures it can reuse", ex: "Voyager · Agent Skills", firm: "A saved “house comps” skill the agent loads whenever it compares two companies", chef: "A new knife; a recipe card", cost: 2, cl: "Hours", undo: "Remove the tool or the skill folder" },
    { n: "Architecture", sub: "how it is built", what: "Its own code and workflow", ex: "Darwin Gödel Machine · SICA", firm: "The agent rewrites its own loop to add a checking step before every memo", chef: "A reorganized kitchen", cost: 3, cl: "Days, and it needs tests to be safe", undo: "Revert the code, if the tests caught the problem" },
    { n: "Model weights", sub: "what it knows", what: "The model's parameters, retrained on rewards", ex: "Reinforcement-learning fine-tuning (GRPO)", firm: "Fine-tuning a model on 10,000 corrected memos. Not possible through an API: the firm can't change Claude's or GPT's weights", chef: "Months of practice; new instincts", cost: 4, cl: "Weeks, and costly", undo: "Hard: retrain, or go back to the old model" }
  ];
  var tabs = root.querySelector(".tabs"), cur = 0;
  L.forEach(function (l, i) {
    var b = document.createElement("button");
    b.type = "button";
    b.innerHTML = (i + 1) + " · " + l.n + "<small>" + l.sub + "</small>";
    b.addEventListener("click", function () { cur = i; draw(); });
    tabs.appendChild(b);
  });
  function draw() {
    var l = L[cur];
    tabs.querySelectorAll("button").forEach(function (b, i) { b.setAttribute("aria-pressed", i === cur); });
    root.querySelector(".name").textContent = "Layer " + (cur + 1) + ": " + l.n;
    root.querySelector(".rows").innerHTML =
      "<dt>What changes</dt><dd>" + l.what + "</dd>" +
      "<dt>Examples today</dt><dd>" + l.ex + "</dd>" +
      "<dt>At the firm</dt><dd>" + l.firm + "</dd>" +
      "<dt>In a kitchen</dt><dd>" + l.chef + "</dd>" +
      "<dt>How to undo it</dt><dd>" + l.undo + "</dd>";
    root.querySelectorAll(".meter i").forEach(function (m, i) { m.className = i < l.cost ? "on" : ""; });
    root.querySelector(".cv").textContent = l.cost + " of 4 · " + l.cl;
  }
  draw();
})();
  </script>
</div>
